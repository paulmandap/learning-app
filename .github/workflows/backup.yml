name: Database backup

# Supabase Free includes NO automatic backups ("Automatic backups: Not included"
# — verified 2026-09-03, see docs/ARCHITECTURE_NOTES.md §2.5). Spec §5 therefore
# requires a monthly export with the CLI. Until this workflow existed, every set,
# note and answer in the project lived in exactly one place with no copy.
#
# ---------------------------------------------------------------------------
# CREDENTIAL NOTE — read before changing anything here.
#
# This is the ONLY workflow in the repo that uses a non-publishable credential.
# keepalive.yml deliberately uses the publishable key, which reaches only what
# RLS allows. A pg_dump cannot work that way: dumping every user's rows is
# exactly the thing RLS exists to prevent, so it needs the direct Postgres
# connection string.
#
# That means SUPABASE_DB_URL is a full-access database credential. It lives only
# in GitHub's encrypted secrets, is never echoed (the URL is passed straight to
# the CLI, and `set -x` is deliberately not used), and no step prints it.
#
# Set it under: Settings → Secrets and variables → Actions
#   SUPABASE_DB_URL     postgresql://postgres.<ref>:<password>@<host>:5432/postgres
#   BACKUP_PASSPHRASE   a long random string, stored somewhere you will still
#                       have it the day you need to restore
#
# Get SUPABASE_DB_URL from: Supabase dashboard → Project Settings → Database →
# Connection string → URI. The password must be percent-encoded if it contains
# @ : / ? # or %.
# ---------------------------------------------------------------------------
#
# PRIVACY: the dump contains students' notes and everything they have answered.
#
# THIS REPOSITORY IS PUBLIC. Artifacts on a public repository can be downloaded
# by anyone with a GitHub account, so a plaintext dump uploaded here would hand
# every student's notes to whoever asked. (An earlier revision of this file said
# the repo was private. It was, until 2026-09-07. That is exactly the kind of
# assumption that stops being true without anything in the file changing.)
#
# So the dump is encrypted with AES-256 before it is uploaded, and the plaintext
# .sql files are deleted from the runner in the same step. The artifact is inert
# without BACKUP_PASSPHRASE, which never leaves GitHub's encrypted secrets.
#
# Kept for 90 days, sent to no third-party storage. Do not add a step that
# uploads, prints or copies the plaintext dump anywhere.
#
# To restore:
#   gpg --decrypt --output backup.tar.gz backup.tar.gz.gpg
#   tar -xzf backup.tar.gz          # -> schema.sql, data.sql
#   psql "$SUPABASE_DB_URL" -f schema.sql && psql "$SUPABASE_DB_URL" -f data.sql

on:
  schedule:
    - cron: '23 4 1 * *' # 04:23 UTC on the 1st of each month
  workflow_dispatch: # so a backup can be taken by hand before a risky migration

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dump schema and data
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL repo secret is not set. See the comment at the top of this file."
            exit 1
          fi

          # Two files, deliberately. `db dump` defaults to schema only, so the
          # data needs its own pass with --data-only. Restoring means applying
          # the schema first and then the rows.
          npx --yes supabase@2 db dump --db-url "$SUPABASE_DB_URL" -f schema.sql
          npx --yes supabase@2 db dump --db-url "$SUPABASE_DB_URL" --data-only --use-copy -f data.sql

      - name: Check the dump is not empty
        run: |
          set -euo pipefail

          # A backup that silently produced an empty file is worse than none,
          # because it looks like protection. Fail loudly instead.
          for f in schema.sql data.sql; do
            if [ ! -s "$f" ]; then
              echo "::error::$f is empty — the dump did not work."
              exit 1
            fi
          done

          # review_state was added by migration 0005 AFTER this list was written,
          # and was silently unchecked until 2026-09-05. A backup check that does
          # not know about a table is exactly the "looks like protection" failure
          # this step exists to prevent — so any future migration that adds a
          # table must add it here too.
          missing=0
          for t in profiles study_sets documents document_pages study_items attempts heartbeat review_state; do
            if ! grep -qi "CREATE TABLE[^;]*\"\?$t\"\?" schema.sql; then
              echo "::error::schema.sql has no CREATE TABLE for $t"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          # The Phase 8 columns ride on study_items rather than adding a table,
          # so they are checked by name — a dump missing them would restore a
          # database the current app cannot query.
          for c in variant_prompt rubric_verified; do
            if ! grep -qi "$c" schema.sql; then
              echo "::error::schema.sql has no $c column on study_items"
              exit 1
            fi
          done

          echo "schema.sql $(wc -c < schema.sql) bytes, data.sql $(wc -c < data.sql) bytes"
          echo "All eight tables and the Phase 8 columns are present."

      - name: Check the rows actually came across
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          # Everything above this point verifies STRUCTURE. A dump carrying every
          # table definition and almost no rows would pass all of it, which is
          # the "looks like protection" failure in its most dangerous form: the
          # schema is reproducible from git, the rows are not.
          #
          # So compare what is in the dump against what is in the database, for
          # the two tables holding data that cannot be regenerated — a student's
          # cards and their answer history.

          if ! command -v psql >/dev/null 2>&1; then
            echo "::error::psql is not available on this runner, so the row counts cannot be verified."
            exit 1
          fi

          fail=0
          for t in study_items attempts; do
            # pg_dump writes one row per line between the COPY header and a lone
            # "\." terminator. Match the header loosely because the CLI has
            # quoted the identifiers differently across versions.
            dumped=$(awk -v tbl="$t" '
              $0 ~ ("^COPY .*" tbl ".*FROM stdin;") { inblock = 1; next }
              inblock && /^\\\.$/                   { inblock = 0 }
              inblock                               { n++ }
              END                                   { print n + 0 }
            ' data.sql)

            live=$(psql "$SUPABASE_DB_URL" -tAc "select count(*) from public.$t")

            if [ "$dumped" != "$live" ]; then
              echo "::error::$t: dump has $dumped row(s), database has $live. The backup is incomplete."
              fail=1
            else
              echo "$t: $dumped row(s), matching the database."
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

      - name: Encrypt the dump
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail

          # Fail here rather than upload plaintext. A missing passphrase must
          # cost a backup, never a disclosure.
          if [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo "::error::BACKUP_PASSPHRASE repo secret is not set. See the comment at the top of this file."
            exit 1
          fi

          tar -czf backup.tar.gz schema.sql data.sql

          # --passphrase-fd 0 keeps the secret off the process command line,
          # where it would be readable by any other process on the runner.
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --quiet \
            --symmetric --cipher-algo AES256 --passphrase-fd 0 \
            --output backup.tar.gz.gpg backup.tar.gz

          # The plaintext must not survive into the upload step.
          rm -f schema.sql data.sql backup.tar.gz

          if [ ! -s backup.tar.gz.gpg ]; then
            echo "::error::encryption produced no output."
            exit 1
          fi

          # Prove it is really encrypted before it is published: the magic bytes
          # must say GPG, and the word COPY (which every data dump contains)
          # must not appear anywhere in the file.
          if ! file backup.tar.gz.gpg | grep -qi 'gpg\|pgp\|encrypted'; then
            echo "::error::backup.tar.gz.gpg is not an encrypted file."
            exit 1
          fi
          if grep -qa 'COPY public\.' backup.tar.gz.gpg; then
            echo "::error::plaintext SQL found inside the encrypted artifact."
            exit 1
          fi

          echo "backup.tar.gz.gpg $(wc -c < backup.tar.gz.gpg) bytes, encrypted."

      - name: Upload backup
        # v7 rather than v4: v4 declares Node 20, which GitHub deprecated and now
        # force-runs on Node 24 — a warning today, a broken backup whenever they
        # stop forcing it. Checked before bumping: name, path, if-no-files-found
        # and retention-days all still exist in v7's inputs.
        #
        # Only the encrypted file is listed. Do not add the .sql files back.
        uses: actions/upload-artifact@v7
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backup.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
