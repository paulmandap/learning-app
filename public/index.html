<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover so the installed PWA fills an iPhone screen past the notch -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />

    <title>Nomi</title>
    <meta name="description" content="Turn your notes into flashcards and quizzes." />

    <!-- PWA. Expo Router does not generate this; it is linked by hand.
         NOTE: this file — not app/+html.tsx — is the HTML template when
         web.output is "single". +html.tsx is only consulted for static/server
         rendering, so PWA metadata placed there is silently dropped. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)" />

    <!-- iOS home-screen install (Share → Add to Home Screen) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nomi" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- react-native-web's recommended reset. -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        /* The page's own background, behind everything React draws.
           It used to be unset, i.e. white. That is invisible until something
           lets you see past the app — a zoom, an overscroll, a rotation — and
           then a dark-themed app is framed in white. The owner hit exactly that
           on an iPhone after a field zoomed the page.
           These two match the theme-color metas above; keep all four in step. */
        background-color: #f7f7f8;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #111318;
        }
      }
      body {
        overflow: hidden;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!-- The splash (NOTES §42): Nomi, painted from this file alone, before the
         JavaScript bundle has loaded — which is most of a cold start on a phone.
         app/_layout.tsx fades it out once the app knows who is signed in.
         The picture is made by scripts/make-splash.ts from Nomi's own layers.
         Backgrounds match the body's above; keep them in step. -->
    <style id="splash-style">
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background-color: #f7f7f8;
        transition: opacity 280ms ease-out;
      }
      #splash img {
        width: 132px;
        height: 177px;
        animation: nomi-splash-float 2.4s ease-in-out infinite;
      }
      #splash .name {
        font: 600 30px/1.2 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        color: #4a2f22;
      }
      #splash.gone {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes nomi-splash-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      @media (prefers-color-scheme: dark) {
        #splash { background-color: #111318; }
        #splash .name { color: #f2e3cc; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img { animation: none; }
        #splash { transition: none; }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="splash" aria-hidden="true">
      <img src="/nomi-splash.webp" alt="" width="132" height="177" />
      <div class="name">Nomi</div>
    </div>
    <div id="root"></div>

    <!-- A white screen tells you nothing. If the app fails to start, show why.
         Runs before the bundle so it catches module-init failures too. -->
    <script>
      (function () {
        function show(title, detail) {
          var el = document.getElementById('startup-error');
          if (!el) {
            el = document.createElement('pre');
            el.id = 'startup-error';
            el.style.cssText =
              'position:fixed;inset:0;margin:0;padding:16px;overflow:auto;z-index:99999;' +
              'background:#fff;color:#b3261e;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;' +
              'white-space:pre-wrap;word-break:break-word;';
            document.body.appendChild(el);
          }
          el.textContent += title + '\n' + detail + '\n\n';
        }
        window.addEventListener('error', function (e) {
          show(
            'Startup error: ' + (e.message || 'unknown'),
            (e.filename || '') + ':' + (e.lineno || '?') + '\n' +
              ((e.error && e.error.stack) || '')
          );
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          show('Unhandled promise rejection', (r && (r.stack || r.message)) || String(r));
        });
      })();
    </script>
  </body>
</html>
