<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover so the installed PWA fills an iPhone screen past the notch -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />

    <title>Nomi</title>
    <meta name="description" content="Turn your notes into flashcards and quizzes." />

    <!-- PWA. Expo Router does not generate this; it is linked by hand.
         NOTE: this file — not app/+html.tsx — is the HTML template when
         web.output is "single". +html.tsx is only consulted for static/server
         rendering, so PWA metadata placed there is silently dropped. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)" />

    <!-- iOS home-screen install (Share → Add to Home Screen) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nomi" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- react-native-web's recommended reset. -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        /* The page's own background, behind everything React draws.
           It used to be unset, i.e. white. That is invisible until something
           lets you see past the app — a zoom, an overscroll, a rotation — and
           then a dark-themed app is framed in white. The owner hit exactly that
           on an iPhone after a field zoomed the page.
           These two match the theme-color metas above; keep all four in step. */
        background-color: #f7f7f8;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #111318;
        }
      }
      body {
        overflow: hidden;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!-- The splash (NOTES §42, §43): Nomi, painted from this file alone, before
         the JavaScript bundle has loaded — which is most of a cold start on a
         phone — and DOING something: waving, studying, thinking or explaining,
         a different one from last time on every load. Never idle; the owner
         asked for Nomi being interactive.

         The five layers in /nomi/ and the rig block below are written by
         scripts/make-splash.ts from Nomi's own layers and NOMI_RIG, so the
         splash owl moves about the same pivots as the app's. The motions follow
         src/core/nomi-motion.ts: a wing positive-outward, the right wing turning
         the other way, eyes blinking toward their own lines.

         app/_layout.tsx fades the splash once the app knows who is signed in.
         Backgrounds match the body's above; keep them in step. -->
    <style id="splash-style">
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background-color: #f7f7f8;
        transition: opacity 280ms ease-out;
      }
      #splash .nomi-in { animation: nomi-in 360ms ease-out both; }
      #splash .nomi {
        position: relative;
        width: var(--nomi-width);
        height: var(--nomi-height);
        transform-origin: 50% 100%;
      }
      #splash .nomi img {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
      }
      #splash .wing-left { transform-origin: var(--wing-left-x) var(--wing-left-y); }
      #splash .wing-right { transform-origin: var(--wing-right-x) var(--wing-right-y); }
      #splash .eye-left { transform-origin: 50% var(--eye-left-line); }
      #splash .eye-right { transform-origin: 50% var(--eye-right-line); }
      #splash .name {
        font: 600 30px/1.2 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        color: #4a2f22;
      }
      #splash.gone {
        opacity: 0;
        pointer-events: none;
      }

      @keyframes nomi-in {
        from { opacity: 0; transform: translateY(10px) scale(0.92); }
        to { opacity: 1; transform: none; }
      }
      @keyframes nomi-blink {
        0%, 88%, 100% { transform: scaleY(1); }
        91% { transform: scaleY(0.1); }
      }

      /* Greeting: one wave, twice over, the way the app's greeting waves. */
      #splash.v-greeting .wing-right { animation: nomi-wave 2.4s ease-in-out infinite; }
      #splash.v-greeting .eye-left,
      #splash.v-greeting .eye-right { animation: nomi-blink 2.4s linear infinite; }
      @keyframes nomi-wave {
        0%, 12% { transform: rotate(0deg); }
        28% { transform: rotate(-135deg); }
        38% { transform: rotate(-112deg); }
        48% { transform: rotate(-135deg); }
        64%, 100% { transform: rotate(0deg); }
      }

      /* Studying: eyes down on the page, a slow reading nod, a blink between lines. */
      #splash.v-studying .nomi { animation: nomi-nod 3.2s ease-in-out infinite; }
      #splash.v-studying .eye-left,
      #splash.v-studying .eye-right { animation: nomi-read 3.2s ease-in-out infinite; }
      @keyframes nomi-nod {
        0%, 100% { transform: rotate(0deg) translateY(0); }
        30% { transform: rotate(1.5deg) translateY(2px); }
        60% { transform: rotate(-1deg) translateY(1px); }
      }
      @keyframes nomi-read {
        0% { transform: translate(calc(var(--eye-radius) * -0.15), calc(var(--eye-radius) * 0.35)) scaleY(1); }
        45% { transform: translate(calc(var(--eye-radius) * 0.2), calc(var(--eye-radius) * 0.35)) scaleY(1); }
        58% { transform: translate(calc(var(--eye-radius) * 0.2), calc(var(--eye-radius) * 0.35)) scaleY(1); }
        61% { transform: translate(calc(var(--eye-radius) * 0.2), calc(var(--eye-radius) * 0.35)) scaleY(0.1); }
        64% { transform: translate(calc(var(--eye-radius) * 0.2), calc(var(--eye-radius) * 0.35)) scaleY(1); }
        100% { transform: translate(calc(var(--eye-radius) * -0.15), calc(var(--eye-radius) * 0.35)) scaleY(1); }
      }

      /* Thinking: a slow head tilt, eyes up and away. */
      #splash.v-thinking .nomi { animation: nomi-tilt 2.8s ease-in-out infinite; }
      #splash.v-thinking .eye-left,
      #splash.v-thinking .eye-right { animation: nomi-ponder 2.8s ease-in-out infinite; }
      @keyframes nomi-tilt {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-4deg); }
        75% { transform: rotate(4deg); }
      }
      @keyframes nomi-ponder {
        0%, 80%, 100% { transform: translate(calc(var(--eye-radius) * 0.22), calc(var(--eye-radius) * -0.22)) scaleY(1); }
        84% { transform: translate(calc(var(--eye-radius) * 0.22), calc(var(--eye-radius) * -0.22)) scaleY(0.1); }
        88% { transform: translate(calc(var(--eye-radius) * 0.22), calc(var(--eye-radius) * -0.22)) scaleY(1); }
      }

      /* Explaining: a wing raised to make a point, a small lean in as it lands. */
      #splash.v-explaining .wing-right { animation: nomi-point 2.2s ease-in-out infinite; }
      #splash.v-explaining .nomi { animation: nomi-lean 2.2s ease-in-out infinite; }
      #splash.v-explaining .eye-left,
      #splash.v-explaining .eye-right { animation: nomi-blink 2.2s linear infinite; }
      @keyframes nomi-point {
        0%, 10% { transform: rotate(0deg); }
        26% { transform: rotate(-58deg); }
        40% { transform: rotate(-42deg); }
        54% { transform: rotate(-58deg); }
        76%, 100% { transform: rotate(0deg); }
      }
      @keyframes nomi-lean {
        0%, 10%, 76%, 100% { transform: scale(1); }
        26% { transform: scale(1.04); }
      }

      @media (prefers-color-scheme: dark) {
        #splash { background-color: #111318; }
        #splash .name { color: #f2e3cc; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash { animation: none !important; transition: none !important; }
      }
    </style>
    <!-- NOMI SPLASH RIG START: written by scripts/make-splash.ts, do not edit by hand -->
    <style id="splash-rig">
      #splash { --nomi-width: 132px; --nomi-height: 177px; --wing-left-x: 17.71%; --wing-left-y: 57.61%; --wing-right-x: 79.84%; --wing-right-y: 63.29%; --eye-left-line: 33.55%; --eye-right-line: 40.55%; --eye-radius: 18.43px; }
    </style>
    <!-- NOMI SPLASH RIG END -->
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="splash" aria-hidden="true">
      <div class="nomi-in">
        <div class="nomi">
          <img class="body" src="/nomi/body.webp" alt="" />
          <img class="eye-left" src="/nomi/eye-left.webp" alt="" />
          <img class="eye-right" src="/nomi/eye-right.webp" alt="" />
          <img class="wing-left" src="/nomi/wing-left.webp" alt="" />
          <img class="wing-right" src="/nomi/wing-right.webp" alt="" />
        </div>
      </div>
      <div class="name">Nomi</div>
    </div>
    <!-- Which one this load: any variant but the last one shown. Plain script,
         run as the page parses, so the choice is made before the first paint.
         The list is SPLASH_VARIANTS in src/core/splash.ts. -->
    <script>
      (function () {
        var variants = ['greeting', 'studying', 'thinking', 'explaining'];
        var last = null;
        try { last = localStorage.getItem('nomi-splash-last'); } catch (e) {}
        var choices = variants.filter(function (v) { return v !== last; });
        var pick = choices[Math.floor(Math.random() * choices.length)];
        try { localStorage.setItem('nomi-splash-last', pick); } catch (e) {}
        document.getElementById('splash').className = 'v-' + pick;
      })();
    </script>
    <div id="root"></div>

    <!-- A white screen tells you nothing. If the app fails to start, show why.
         Runs before the bundle so it catches module-init failures too. -->
    <script>
      (function () {
        function show(title, detail) {
          var el = document.getElementById('startup-error');
          if (!el) {
            el = document.createElement('pre');
            el.id = 'startup-error';
            el.style.cssText =
              'position:fixed;inset:0;margin:0;padding:16px;overflow:auto;z-index:99999;' +
              'background:#fff;color:#b3261e;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;' +
              'white-space:pre-wrap;word-break:break-word;';
            document.body.appendChild(el);
          }
          el.textContent += title + '\n' + detail + '\n\n';
        }
        window.addEventListener('error', function (e) {
          show(
            'Startup error: ' + (e.message || 'unknown'),
            (e.filename || '') + ':' + (e.lineno || '?') + '\n' +
              ((e.error && e.error.stack) || '')
          );
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          show('Unhandled promise rejection', (r && (r.stack || r.message)) || String(r));
        });
      })();
    </script>
  </body>
</html>
